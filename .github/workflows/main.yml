name: Filter and Version SQL Submissions

on:
  push:
    branches:
      - main

jobs:
  clean-and-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Auto-cleanup')"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Pull full history to read previous versions cleanly

    - name: Process Submissions
      run: |
        FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
        CHANGES_MADE=false

        for file in $FILES; do
          # 1. Protect repo-level system files and the main root README
          if [[ "$file" == .github* || "$file" == "README.md" ]]; then
            echo "Skipping main repository system file: $file"
            continue
          fi

          # 2. Clean Non-SQL files immediately
          if [[ "$file" != *.sql && "$(basename "$file")" != "README.md" && -f "$file" ]]; then
            echo "Removing non-SQL file: $file"
            git rm -rf "$file"
            CHANGES_MADE=true
            continue
          fi

          # 3. Handle LeetHub SQL files without losing history
          if [[ "$(basename "$file")" == "Solution.sql" && -f "$file" ]]; then
            DIR_PATH=$(dirname "$file")
            
            # Copy the new solution content to a safe temporary location
            cp "$file" /tmp/new_solution_temp.sql
            
            # Revert the current change to see exactly what files were in this folder previously
            git checkout HEAD~1 -- "$DIR_PATH" 2>/dev/null || true
            
            # Find the next sequential number that does not exist in the folder
            COUNT=1
            while [ -f "$DIR_PATH/Solution_$COUNT.sql" ]; do
              COUNT=$((COUNT + 1))
            done
            
            NEW_NAME="$DIR_PATH/Solution_$COUNT.sql"
            echo "Saving new submission safely as: $NEW_NAME"
            
            # Re-checkout everything from the current commit to keep our baseline intact
            git checkout HEAD -- "$DIR_PATH" 2>/dev/null || true
            
            # Move our temporary file into its brand new, unique slot
            mv /tmp/new_solution_temp.sql "$NEW_NAME"
            
            # Tell Git to completely remove the generic 'Solution.sql' so it doesn't stay behind
            git rm -f "$file" 2>/dev/null || true
            git add "$NEW_NAME"
            CHANGES_MADE=true
          fi
        done

        # Clean empty folders
        find . -type d -empty -not -path "./.git*" -delete

        # Push updates back if modifications were made
        if [ "$CHANGES_MADE" = true ]; then
          git config --global user.name "SQL Filter Bot"
          git config --global user.email "bot@github.com"
          git commit -m "Auto-cleanup: Processed and versioned SQL submission"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No modifications needed."
        fi
