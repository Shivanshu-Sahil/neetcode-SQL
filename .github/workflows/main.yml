name: Filter and Version SQL Submissions

on:
  push:
    branches:
      - main

jobs:
  clean-and-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Auto-cleanup')"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Process Submissions
      run: |
        FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
        CHANGES_MADE=false

        for file in $FILES; do
          # 1. Protect repo-level system files and the main root README
          if [[ "$file" == .github* || "$file" == "README.md" ]]; then
            echo "Skipping main repository system file: $file"
            continue
          fi

          # 2. Clean Non-SQL files immediately
          if [[ "$file" != *.sql && "$(basename "$file")" != "README.md" && -f "$file" ]]; then
            echo "Removing non-SQL file: $file"
            git rm -rf "$file"
            CHANGES_MADE=true
            continue
          fi

          # 3. Version LeetHub SQL files numerically (Solution_1, Solution_2...)
          if [[ "$file" == *.sql && -f "$file" ]]; then
            if [[ "$(basename "$file")" == "Solution.sql" ]]; then
              DIR_PATH=$(dirname "$file")
              
              # Count existing versioned SQL files in this folder to determine the next number
              COUNT=1
              while [ -f "$DIR_PATH/Solution_$COUNT.sql" ]; do
                COUNT=$((COUNT + 1))
              done
              
              NEW_NAME="$DIR_PATH/Solution_$COUNT.sql"
              
              echo "Versioning file: $file -> $NEW_NAME"
              mv "$file" "$NEW_NAME"
              git rm "$file"
              git add "$NEW_NAME"
              CHANGES_MADE=true
            fi
          fi
        done

        # Clean empty folders
        find . -type d -empty -not -path "./.git*" -delete

        # Push updates back if modifications were made
        if [ "$CHANGES_MADE" = true ]; then
          git config --global user.name "SQL Filter Bot"
          git config --global user.email "bot@github.com"
          git commit -m "Auto-cleanup: Processed and versioned SQL submission"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No modifications needed."
        fi
