name: Filter SQL Submissions Only (NeetCode + LeetCode)

on:
  push:
    branches:
      - main  # Change to your default branch name if it is 'master'

jobs:
  clean-repo:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Auto-cleanup')"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Remove Non-SQL Files from Latest Commit
      run: |
        FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
        NON_SQL_FOUND=false

        for file in $FILES; do
          # Ignore repository-level system files
          if [[ "$file" == .github* ]]; then
            continue
          fi

          # If it's a README, check if there is a SQL file in its directory
          if [[ "$(basename "$file")" == "README.md" ]]; then
            DIR_PATH=$(dirname "$file")
            # If a .sql file exists in the same folder, skip deletion (save the README!)
            if ls "$DIR_PATH"/*.sql >/dev/null 2>&1; then
              echo "Saving README for SQL problem: $file"
              continue
            fi
          fi

          # Delete the file if it is NOT a SQL file
          if [[ "$file" != *.sql && -f "$file" ]]; then
            echo "Removing non-SQL file: $file"
            git rm -rf "$file"
            NON_SQL_FOUND=true
          fi
        done

        # Clean up empty parent directories left behind by deleted non-SQL problems
        if [ "$NON_SQL_FOUND" = true ]; then
          find . -type d -empty -not -path "./.git*" -delete
          
          git config --global user.name "SQL Filter Bot"
          git config --global user.email "bot@github.com"
          
          git commit -m "Auto-cleanup: Removed non-SQL files from submission"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No action required. Repository is clean."
        fi
